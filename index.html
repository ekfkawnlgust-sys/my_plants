<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f6f1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="My Plants">
<title>My Plants · 식물 관리</title>
<style>
:root{
  --bg:#f4f6f1;--surface:#fff;--ink:#1f2b22;--ink2:#435047;--muted:#76817a;--line:#e5eae1;--line2:#d4dccf;
  --green:#3a6a46;--green-d:#2e5638;--green-s:#e4eee0;
  --amber:#94600f;--amber-s:#fbf0d8;--red:#ad3f2e;--red-s:#fbe7e2;
  --water:#2c6b90;--water-s:#e2eef5;--fert:#68509e;--fert-s:#eee9f7;--repot:#875a2d;--repot-s:#f4ebdf;--check:#3f6a55;--check-s:#e5efe9;
  --r:16px;--nav-h:60px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Segoe UI",sans-serif;word-break:keep-all;overflow-wrap:anywhere}
body.locked{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
.app{max-width:760px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(var(--nav-h) + env(safe-area-inset-bottom) + 32px)}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:2px 0 14px}
.top h1{font-size:22px;line-height:1.2;margin:0;font-weight:800;letter-spacing:-.3px}
.top .date{font-size:13px;color:var(--muted);margin-top:2px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:12px;background:var(--green);color:#fff;font-weight:700;font-size:15px;white-space:nowrap}
.btn:active{transform:scale(.98)}
.btn.soft{background:var(--green-s);color:var(--green-d)}
.btn.line{background:var(--surface);color:var(--ink2);border:1px solid var(--line2)}
.btn.danger{background:var(--red-s);color:var(--red)}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px;border-radius:10px}
.btn.block{width:100%}
.btn[disabled]{opacity:.5}
.linkbtn{color:var(--green);font-weight:700;font-size:14px;padding:6px 2px}

/* sections */
.sec{margin:22px 0 10px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.sec h2{font-size:17px;margin:0;font-weight:800;display:flex;align-items:center;gap:7px}
.sec .cnt{font-size:13px;font-weight:700;color:var(--muted)}
.sec.over h2{color:var(--red)}
.hint{font-size:13px;color:var(--muted)}

/* summary */
.summary{display:flex;gap:8px;margin-bottom:6px}
.summary div{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.summary b{display:block;font-size:22px;line-height:1.15}
.summary span{font-size:12px;color:var(--muted)}
.summary .is-over b{color:var(--red)}
.summary .is-done b{color:var(--green)}
.summary .is-warn b{color:var(--amber)}
.summary span{white-space:nowrap}
.tagx{display:inline-block;font-size:11.5px;font-weight:700;padding:1px 6px;border-radius:6px;background:var(--amber-s);color:#6c4a10;margin-left:4px;vertical-align:1px}
.tagx.red{background:var(--red-s);color:var(--red)}
.pbadge.warn{background:var(--amber)}
.pbadge.red{background:var(--red);top:auto;bottom:8px}
.mlist{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:14px}
.mlist label{display:flex;align-items:center;gap:10px;padding:8px 12px;border-top:1px solid var(--line);min-height:52px}
.mlist label:first-child{border-top:0}
.mlist input{width:22px;height:22px;accent-color:var(--green);flex-shrink:0}
.mlist select{min-height:36px!important;padding:4px 28px 4px 8px!important;font-size:14px!important;max-width:44%}
.details{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:14px}
.details summary{padding:12px 14px;font-weight:700;font-size:14.5px;color:var(--ink2);cursor:pointer;list-style:none}
.details summary::-webkit-details-marker{display:none}
.details summary::after{content:'＋';float:right;color:var(--muted)}
.details[open] summary::after{content:'－'}
.details .in{padding:0 14px 2px}
.facts{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13.5px;margin:4px 0 12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.facts dt{color:var(--muted)}
.facts dd{margin:0;color:var(--ink)}
.banner{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--amber-s);color:#6c4a10;border-radius:12px;padding:10px 12px;font-size:14px;margin:10px 0}

/* plant group (today) */
.pgroup{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.pgroup.over{border-color:#efcfc7}
.phead{display:flex;align-items:center;gap:11px;padding:11px 12px 6px;width:100%;text-align:left}
.pname{font-weight:800;font-size:16px;line-height:1.3}
.psub{font-size:12.5px;color:var(--muted);line-height:1.35}
.thumb{width:44px;height:44px;border-radius:12px;object-fit:cover;flex-shrink:0;background:var(--green-s);display:grid;place-items:center;font-size:22px;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.trow{display:flex;align-items:center;gap:10px;padding:8px 10px 8px 12px;border-top:1px solid var(--line)}
.pgroup .trow:first-of-type{border-top:0}
.kchip{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:17px;flex-shrink:0}
.k-water .kchip{background:var(--water-s)}.k-fertilizer .kchip{background:var(--fert-s)}.k-repot .kchip{background:var(--repot-s)}.k-check .kchip{background:var(--check-s)}.k-other .kchip{background:var(--green-s)}
.grow{flex:1;min-width:0}
.tl{font-weight:700;font-size:15px;line-height:1.3}
.tl small{font-weight:600;color:var(--ink2);font-size:13px}
.ts{font-size:12.5px;color:var(--muted);line-height:1.35;margin-top:1px}
.due{font-weight:700}
.due.over{color:var(--red)}.due.today{color:var(--green)}.due.soon{color:var(--amber)}
.done-btn{width:48px;height:44px;border-radius:12px;background:var(--green);color:#fff;font-size:19px;font-weight:800;flex-shrink:0;display:grid;place-items:center}
.done-btn:active{transform:scale(.95)}
.more-btn{width:38px;height:44px;border-radius:12px;color:var(--muted);font-size:20px;flex-shrink:0;display:grid;place-items:center}
.more-btn:active{background:var(--line)}
.hintrow{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--surface);border:1px dashed var(--line2);border-radius:12px;padding:10px 12px;font-size:13.5px;color:var(--ink2);margin-bottom:10px}

/* compact lists */
.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.lrow{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--line);width:100%;text-align:left}
.lrow:first-child{border-top:0}
.lrow .em{font-size:17px;width:24px;text-align:center;flex-shrink:0}
.lrow .t{font-size:14.5px;font-weight:650;line-height:1.35}
.lrow .s{font-size:12.5px;color:var(--muted);line-height:1.35}
.lrow.done .t{color:var(--ink2)}
.lrow .tag{font-size:12px;font-weight:700;padding:2px 7px;border-radius:99px;background:var(--line);color:var(--ink2);white-space:nowrap}
.daygroup{padding:10px 12px;border-top:1px solid var(--line)}
.daygroup:first-child{border-top:0}
.daygroup .dl{font-size:13px;font-weight:800;color:var(--ink2);margin-bottom:5px}
.daygroup .dl span{color:var(--muted);font-weight:600;margin-left:5px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:13.5px;padding:5px 10px;border-radius:99px;background:var(--bg);border:1px solid var(--line);color:var(--ink2);min-height:32px}
.chip.on{background:var(--green);border-color:var(--green);color:#fff;font-weight:700}
.empty{text-align:center;color:var(--muted);padding:26px 14px;font-size:14.5px;background:var(--surface);border:1px dashed var(--line2);border-radius:var(--r)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:2px}

/* plants */
.toolbar{display:flex;gap:8px;margin-bottom:10px}
.search{flex:1;min-width:0;height:44px;border:1px solid var(--line2);border-radius:12px;padding:0 12px;background:var(--surface);font-size:16px}
.sortsel{height:44px;border:1px solid var(--line2);border-radius:12px;padding:0 8px;background:var(--surface);font-size:15px;max-width:42%}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin:0 -16px 6px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters .chip{white-space:nowrap;flex-shrink:0}
.flabel{font-size:12px;color:var(--muted);font-weight:700;margin:4px 0 5px}
.pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;text-align:left;display:flex;flex-direction:column}
.pphoto{aspect-ratio:4/3;background:var(--green-s);display:grid;place-items:center;font-size:40px;position:relative}
.pphoto img{width:100%;height:100%;object-fit:cover;display:block;position:absolute;inset:0}
.pbadge{position:absolute;top:8px;left:8px;font-size:12px;font-weight:800;padding:3px 8px;border-radius:99px;background:var(--red);color:#fff}
.pbody{padding:9px 11px 11px}
.pbody .pname{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbody .psub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ptags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.ptag{font-size:11.5px;padding:2px 7px;border-radius:99px;background:var(--bg);color:var(--ink2);border:1px solid var(--line)}
.pnext{font-size:12.5px;margin-top:6px;color:var(--ink2)}

/* calendar */
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.calhead b{font-size:18px}
.navbtn{width:44px;height:40px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:18px;color:var(--ink2)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:6px}
.wd{text-align:center;font-size:12px;color:var(--muted);padding:4px 0;font-weight:700}
.wd.sun{color:#b45a4a}.wd.sat{color:#4a6fa5}
.day{min-height:64px;border-radius:10px;padding:4px 3px;text-align:left;display:flex;flex-direction:column;gap:2px;border:1px solid transparent;overflow:hidden}
.day.dim{opacity:.38}
.day.today{background:var(--green-s)}
.day.sel{border-color:var(--green);box-shadow:inset 0 0 0 1px var(--green)}
.dn{font-size:12.5px;font-weight:800;padding-left:2px}
.day.today .dn{color:var(--green-d)}
.marks{display:flex;flex-wrap:wrap;gap:1px 3px;font-size:11.5px;line-height:1.3}
.mk{white-space:nowrap}
.mk b{font-weight:700;font-size:11px}
.mk.over{color:var(--red)}
.mk.pred{opacity:.45}
.mk.done{color:var(--green);font-weight:800}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;color:var(--muted);margin:8px 2px 0}

/* care */
.prog{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:10px}
.prog .ph{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.rot{display:flex;flex-wrap:wrap;align-items:center;gap:5px;margin-top:8px}
.rot .step{font-size:13px;padding:4px 9px;border-radius:99px;background:var(--fert-s);color:var(--fert)}
.rot .step.next{background:var(--fert);color:#fff;font-weight:700}
.rot .arrow{color:var(--muted);font-size:12px}
.pgh{font-size:13px;font-weight:800;color:var(--ink2);margin:16px 2px 6px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.pgh span{font-weight:500;color:var(--muted);font-size:12px}

/* forms & modal */
.modalbg{position:fixed;inset:0;background:rgba(18,28,21,.42);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:600px;max-height:92dvh;max-height:92vh;overflow:auto;overscroll-behavior:contain;background:var(--bg);border-radius:20px 20px 0 0;padding:6px 16px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px rgba(0,0,0,.15)}
.grab{width:38px;height:5px;border-radius:9px;background:var(--line2);margin:4px auto 6px}
.shead{display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:-6px;background:var(--bg);padding:6px 0 10px;z-index:2}
.shead h3{font-size:18px;margin:0;line-height:1.3}
.xbtn{width:40px;height:40px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:16px;color:var(--muted);flex-shrink:0}
.field{margin-bottom:14px}
.field>label,.flab{display:block;font-size:13px;font-weight:700;color:var(--ink2);margin-bottom:6px}
.field input:not([type=checkbox]):not([type=file]),.field select,.field textarea{width:100%;min-height:46px;border:1px solid var(--line2);border-radius:12px;padding:10px 12px;background:var(--surface);font-size:16px;-webkit-appearance:none;appearance:none}
.field select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
.field input[type=date]{display:block}
.field textarea{min-height:70px;resize:vertical}
.field small,.fhelp{display:block;font-size:12.5px;color:var(--muted);margin-top:5px;line-height:1.45}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:15px;margin-bottom:14px}
.check input{width:22px;height:22px;accent-color:var(--green);flex-shrink:0}
.note{font-size:13px;color:var(--ink2);background:var(--green-s);border-radius:12px;padding:10px 12px;margin:0 0 14px;line-height:1.5}
.note.warn{background:var(--amber-s);color:#6c4a10}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.actions .btn{flex:1}
.photo-pick{display:flex;align-items:center;gap:12px}
.photo-pick .pv{width:84px;height:84px;border-radius:14px;background:var(--green-s);display:grid;place-items:center;font-size:30px;overflow:hidden;flex-shrink:0;border:1px dashed var(--line2)}
.photo-pick .pv img{width:100%;height:100%;object-fit:cover}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;font-size:100px;cursor:pointer}
.menu{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:12px}
.menu>button{display:flex;align-items:center;gap:12px;padding:0 14px;min-height:52px;text-align:left;border-top:1px solid var(--line);font-size:15.5px;font-weight:600}
.menu>button:first-child{border-top:0}
.menu>button span.i{width:24px;text-align:center;font-size:18px}
.menu>button.dangerous{color:var(--red)}
.menu .sub{padding:4px 14px 12px}
.dhero{display:flex;gap:14px;align-items:center;margin-bottom:12px}
.dhero .big{width:96px;height:96px;border-radius:18px;background:var(--green-s);display:grid;place-items:center;font-size:40px;overflow:hidden;flex-shrink:0}
.dhero .big img{width:100%;height:100%;object-fit:cover}
.qgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:6px}
.qbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:64px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-size:13px;font-weight:700;color:var(--ink2)}
.qbtn span{font-size:21px}
.album{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.album button{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--green-s)}
.album img{width:100%;height:100%;object-fit:cover;display:block}
.album span{position:absolute;left:0;right:0;bottom:0;font-size:11px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.55));padding:10px 5px 4px;text-align:left}
.rotedit{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.rotitem{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 6px 6px 10px}
.rotitem.next{border-color:var(--fert);box-shadow:inset 0 0 0 1px var(--fert)}
.rotitem .num{width:24px;height:24px;border-radius:50%;background:var(--fert-s);color:var(--fert);display:grid;place-items:center;font-size:13px;font-weight:800;flex-shrink:0}
.rotitem.next .num{background:var(--fert);color:#fff}
.rotitem .nm{flex:1;min-width:0;font-size:14.5px;font-weight:650}
.rotitem .nm small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.ibtn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:14px;color:var(--ink2);flex-shrink:0}
.ibtn[disabled]{opacity:.3}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:10px}
.card h3{margin:0 0 4px;font-size:16px}
.card p{margin:0 0 10px;font-size:13.5px;color:var(--ink2)}
.kv{font-size:13.5px;color:var(--ink2);margin:2px 0}

/* toast */
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 12px);z-index:60;width:min(92%,520px);pointer-events:none}
.toast{display:flex;align-items:center;gap:12px;background:#1f2b22;color:#fff;border-radius:14px;padding:12px 14px;font-size:14.5px;box-shadow:0 8px 30px rgba(0,0,0,.25);pointer-events:auto;animation:tin .18s ease-out}
.toast .msg{flex:1}
.toast button{color:#b9e3c2;font-weight:800;font-size:14.5px;padding:6px 4px;white-space:nowrap}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.94);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav-h)}
.nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:700;color:var(--muted)}
.nav button svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.nav button.on{color:var(--green)}
.nav .badge{position:absolute;margin:-26px 0 0 26px;background:var(--red);color:#fff;font-size:10.5px;min-width:17px;height:17px;border-radius:9px;display:grid;place-items:center;padding:0 4px}
.nav button{position:relative}

@media (min-width:640px){
  .app{padding-left:24px;padding-right:24px}
  .pgrid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .modalbg{align-items:center;padding:20px}
  .sheet{border-radius:20px;max-height:88vh}
  .grab{display:none}
  .day{min-height:84px;padding:6px 5px}
  .marks{font-size:12.5px}
  .filters{margin:0 0 6px;padding:0 0 4px;flex-wrap:wrap}
}
@media (max-width:360px){
  .summary{gap:5px}.summary div{padding:8px 7px}.summary b{font-size:19px}.summary span{font-size:11px}
  .app{padding-left:12px;padding-right:12px}
  .day{min-height:56px;padding:3px 1px}
  .marks{font-size:10.5px}
  .done-btn{width:44px}
  .qgrid{gap:6px}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div><h1 id="pageTitle">오늘</h1><div class="date" id="todayDate"></div></div>
    <button class="btn soft sm" data-a="addPlant">＋ 식물</button>
  </header>

function pgroup(type){

}

const SEED_PLANTS=[['립살리스 폭스테일','관엽식물'],['무늬 스킨답서스','관엽식물'],['아이비','관엽식물'],['보스턴 고사리','고사리'],['골풀','기타'],['피쉬본','선인장'],['바질','허브·채소'],['러브체인','다육이'],['콩란','다육이'],['차이니즈 머니 플랜트(무늬 필레아 추정)','관엽식물'],['불사조','다육이'],['꽃기린','다육이'],['아랄리아','관엽식물'],['이오난사','착생식물']];
const SEED_PRODUCTS=[['하이포넥스 영양제','액체 영양제',''],['대유 뿌리커 수용제','뿌리 활력제',''],['아그로믹 파워','뿌리 활력·토양 보조',''],['마감프K','완효성 비료',''],['오스모코트','완효성 비료',''],['메네델','뿌리 활력제','100~200'],['미리근','뿌리 활력제',''],['파워인칼','칼슘·영양 보조',''],['카르타스 칼슘','칼슘제',''],['피터스 칼슘','칼슘제',''],['하이폴리아 플러스','엽면 영양제',''],['페펙트 칼','칼슘제',''],['네가메가','영양·토양 보조',''],['아쿠도입제','병해충 관리',''],['코모도','살충제·라벨 확인',''],['코니도','살충제·라벨 확인',''],['상토','토양·배지',''],['산야초','토양·배지',''],['휴가토','토양·배지',''],['적옥토 세립(화장토)','토양·배지','']];

/* ---------- 날짜 ---------- */
const p2=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
const today=()=>ymd(new Date());
const plus=(s,n)=>{const d=new Date((s||today())+'T12:00:00');d.setDate(d.getDate()+Number(n||0));return ymd(d)};
const dayDiff=(a,b)=>Math.round((new Date(a+'T12:00:00')-new Date(b+'T12:00:00'))/864e5);
const WD='일월화수목금토';
const isDate=s=>/^\d{4}-\d{2}-\d{2}$/.test(s||'')&&!isNaN(new Date(s+'T12:00:00'));
function fmt(s){if(!s)return '미정';const d=new Date(s+'T12:00:00');if(isNaN(d))return String(s);const y=d.getFullYear()!==new Date().getFullYear()?d.getFullYear()+'.':'';return `${y}${d.getMonth()+1}.${d.getDate()} (${WD[d.getDay()]})`}
function rel(s){if(!s)return '';const n=dayDiff(s,today());if(n===0)return '오늘';if(n===1)return '내일';if(n===2)return '모레';if(n===-1)return '어제';return n>0?`${n}일 후`:`${-n}일 지남`}
function relClass(s){if(!s)return '';const n=dayDiff(s,today());return n<0?'over':n===0?'today':n<=2?'soon':''}

/* ---------- 상태 ---------- */
let db;
const state={plants:[],products:[],tasks:[],logs:[],settings:null};
const ui={tab:'today',month:null,day:null,q:'',cat:'전체',method:'전체',sort:'urgent',lastDate:today()};
let busy=false, lastUndo=null, modalBack=null;

const label=p=>(p?.nickname||'').trim()||p?.name||'이름 미정';
const pby=id=>state.plants.find(p=>p.id===id);
const prodby=id=>state.products.find(p=>p.id===id);
const prodName=(id,fallback)=>prodby(id)?.name||fallback||(id?'삭제된 제품':'');
const plantOk=id=>!!pby(id);
const growOf=p=>p?.growMethod||inferGrowMethod(p||{});
const settings=()=>state.settings||{id:'main'};
const progs=()=>settings().fertPrograms||{};

function inferCat(n){n=n||'';if(/고사리/.test(n))return '고사리';if(/피쉬본/.test(n))return '선인장';if(/러브체인|콩란|불사조|꽃기린/.test(n))return '다육이';if(/이오난사/.test(n))return '착생식물';if(/바질/.test(n))return '허브·채소';return '관엽식물'}
function inferGrowMethod(p){const n=typeof p==='string'?p:(p?.name||'');if(/무늬 스킨답서스|아이비/.test(n))return '수경재배';if(/이오난사/.test(n))return '착생·공중재배';return '흙·배합토'}
function programKey(c,m){return `${c}::${m||'흙·배합토'}`}
function parseProgramKey(k){const i=k.indexOf('::');return i<0?{category:k,method:'흙·배합토',legacy:true}:{category:k.slice(0,i),method:k.slice(i+2)}}
function progKeyFor(p){if(!p||p.fertProgramOptOut)return null;const all=progs(),k=programKey(p.category||'기타',growOf(p));if(all[k])return k;if(all[p.category]&&(all[p.category].method||'흙·배합토')===growOf(p))return p.category;return null}
function progNextId(pr){const ids=pr?.productIds||[];if(!ids.length)return null;const start=((pr.nextIndex||0)%ids.length+ids.length)%ids.length;for(let i=0;i<ids.length;i++){const id=ids[(start+i)%ids.length];if(prodby(id))return id}return null}

/* ---------- IndexedDB ---------- */
function openDB(){return new Promise((ok,no)=>{
  if(!window.indexedDB)return no(Error('이 브라우저는 저장소(IndexedDB)를 지원하지 않아요.'));
  const r=indexedDB.open(DB_NAME,DB_VER);
  r.onupgradeneeded=()=>{const d=r.result;STORES.forEach(n=>{if(!d.objectStoreNames.contains(n))d.createObjectStore(n,{keyPath:'id'})})};
  r.onsuccess=()=>{const d=r.result;d.onversionchange=()=>{d.close();alert('다른 탭에서 앱이 업데이트됐어요. 페이지를 새로고침해 주세요.')};ok(d)};
  r.onerror=()=>no(r.error);
})}
function getAll(n){return new Promise((ok,no)=>{const r=db.transaction(n).objectStore(n).getAll();r.onsuccess=()=>ok(r.result||[]);r.onerror=()=>no(r.error)})}
async function loadAll(){
  const [plants,products,tasks,logs,sets]=await Promise.all(STORES.map(getAll));
  const ok=x=>x&&typeof x==='object'&&x.id!=null;
  Object.assign(state,{plants:plants.filter(ok),products:products.filter(ok),tasks:tasks.filter(ok),logs:logs.filter(ok),settings:sets.find(x=>x&&x.id==='main')||null});
}
/* 변경 묶음: 여러 저장소의 저장/삭제를 하나의 트랜잭션으로 처리 (중간 실패 시 전부 취소) */
class Ch{
  constructor(){this.put={};this.del={}}
  p(s,x){const a=(this.put[s]??=[]);const i=a.findIndex(y=>y.id===x.id);if(i>=0)a[i]=x;else a.push(x);return x}
  d(s,id){const a=(this.del[s]??=[]);if(!a.includes(id))a.push(id);if(this.put[s])this.put[s]=this.put[s].filter(y=>y.id!==id)}
  get empty(){return !Object.values(this.put).some(a=>a.length)&&!Object.values(this.del).some(a=>a.length)}
}
function commit(ch){
  const stores=STORES.filter(s=>(ch.put[s]?.length||ch.del[s]?.length));
  if(!stores.length)return Promise.resolve();
  return new Promise((ok,no)=>{
    let t;try{t=db.transaction(stores,'readwrite')}catch(e){return no(e)}
    for(const s of stores){const os=t.objectStore(s);for(const id of ch.del[s]||[])os.delete(id);for(const x of ch.put[s]||[])os.put(x)}
    t.oncomplete=()=>{applyLocal(ch);ok()};
    t.onerror=()=>no(t.error||Error('저장 실패'));
    t.onabort=()=>{const e=t.error;no(e&&e.name==='QuotaExceededError'?Error('저장 공간이 부족해서 저장하지 못했어요. 기존 데이터는 그대로예요. 백업 후 오래된 사진 기록을 정리해 주세요.'):(e||Error('저장이 취소됐어요. 기존 데이터는 그대로예요.')))};
  })
}
function applyLocal(ch){
  for(const s of STORES){
    const dels=ch.del[s]||[],puts=ch.put[s]||[];
    if(s==='settings'){if(dels.includes('main'))state.settings=null;const m=puts.find(x=>x.id==='main');if(m)state.settings=m;continue}
    if(dels.length)state[s]=state[s].filter(x=>!dels.includes(x.id));
    for(const x of puts){const i=state[s].findIndex(y=>y.id===x.id);if(i>=0)state[s][i]=x;else state[s].push(x)}
  }
}
function inverseOf(ch){
  const inv=new Ch();
  const prevOf=(s,id)=>s==='settings'?(id==='main'?state.settings:null):state[s].find(y=>y.id===id);
  for(const s in ch.put)for(const x of ch.put[s]){const prev=prevOf(s,x.id);if(prev)inv.p(s,clone(prev));else inv.d(s,x.id)}
  for(const s in ch.del)for(const id of ch.del[s]){const prev=prevOf(s,id);if(prev)inv.p(s,clone(prev))}
  return inv;
}
/* 저장 + 되돌리기 토스트 */
async function save(ch,msg,{undo=true}={}){
  const inv=undo?inverseOf(ch):null;
  await commit(ch);
  render();
  if(undo){lastUndo={fn:async()=>{await commit(inv);render();toast('되돌렸어요.')}};toast(msg,true)}
  else if(msg)toast(msg);
}
/* 시트를 닫고 저장한 뒤, 이전 화면(식물 상세 등)을 최신 데이터로 다시 열기 */
async function finish(ch,msg,opts){const b=modalBack;closeSheet(false);await save(ch,msg,opts);if(b)b()}
/* 연속 탭·중복 저장 방지 */
async function run(fn){
  if(busy)return;busy=true;
  try{await fn()}catch(e){console.error(e);alert(e?.message||String(e))}
  finally{busy=false}
}

/* ---------- 마이그레이션 (기존 데이터 보존, 추가 필드만 채움) ---------- */
function defaultTasks(p,{waterDays=5,waterNext=today()}={}){
  return [
    {id:uid(),plantId:p.id,kind:'water',nextDate:waterNext,intervalDays:waterDays,intervalMode:'days',note:p.growMethod==='수경재배'?'물 교체·수위 점검':'흙 마름 확인 후 물주기',lastCompleted:'',paused:false,createdAt:new Date().toISOString()},
    {id:uid(),plantId:p.id,kind:'repot',nextDate:plus(today(),365),intervalDays:365,intervalMode:'days',note:'분갈이 필요성 확인',lastCompleted:'',paused:false,createdAt:new Date().toISOString()}
  ];
}
async function migrate(){
  const ch=new Ch();
  const hadAny=state.settings||state.plants.length||state.products.length||state.tasks.length||state.logs.length;
  const s={id:'main',...(state.settings||{})};
  // 1) 첫 실행에만 기본 식물·제품을 넣음. 이후에는 삭제한 항목이 되살아나지 않음.
  if(!hadAny&&!s.seeded){
    for(const [name,type,dil] of SEED_PRODUCTS)ch.p('products',{id:uid(),name,type,dilution:dil||'',amount:'',note:name==='메네델'?'제품 안내 기준 100~200배 희석. 사용 전 보유 제품 라벨을 우선 확인하세요.':'제품 라벨에서 희석 배수·사용량 확인 후 입력하세요.'});
    for(const [name,category] of SEED_PLANTS){const p={id:uid(),name,nickname:'',category,growMethod:inferGrowMethod(name),medium:'',photo:'',note:'',createdAt:new Date().toISOString(),defaultsCreated:true};ch.p('plants',p);defaultTasks(p).forEach(t=>ch.p('tasks',t))}
  }
  s.seeded=true;
  // 2) 식물 필드 보정 + (이전 버전처럼) 기본 일정이 없는 식물은 1회만 생성
  for(const p of state.plants){
    let np=null;const up=()=>np??={...p};
    if(!p.category)up().category=inferCat(p.name);
    if(!p.growMethod)up().growMethod=inferGrowMethod(p);
    if(!p.defaultsCreated){
      const has=k=>state.tasks.some(t=>t.plantId===p.id&&t.kind===k);
      const d=defaultTasks(np||p);
      if(!has('water'))ch.p('tasks',d[0]);
      if(!has('repot'))ch.p('tasks',d[1]);
      up().defaultsCreated=true;
    }
    if(np)ch.p('plants',np);
  }
  // 2-1) 이전 버전에서 중복 생성된 '한 번도 쓰지 않은 기본 일정' 정리
  //      (같은 식물·같은 종류·같은 주기, 완료 기록·연결된 기록이 전혀 없는 사본만 삭제)
  if(!s.dedupedV3){
    const usedIds=new Set(state.logs.map(l=>l.taskId).filter(Boolean));
    const groups=new Map();
    for(const t of state.tasks){if(t.generatedByProgram)continue;const k=[t.plantId,t.kind,t.intervalMode||'days',t.intervalDays||0,t.intervalCount||0,t.productId||''].join('|');if(!groups.has(k))groups.set(k,[]);groups.get(k).push(t)}
    for(const ts of groups.values()){
      if(ts.length<2)continue;
      const keep=ts.find(t=>t.lastCompleted||usedIds.has(t.id))||ts.slice().sort((a,b)=>(a.createdAt||'').localeCompare(b.createdAt||''))[0];
      for(const t of ts)if(t!==keep&&!t.lastCompleted&&!usedIds.has(t.id)){ch.d('tasks',t.id);(s.migrationRemovedTasks??=[]).push(clone(t))}
    }
    s.dedupedV3=true;
  }
  // 3) 이전 버전의 '시비 건너뛰기' 기록을 건너뜀으로 표시 (영양제를 준 것으로 보이지 않도록)
  for(const l of state.logs){if(!l.skipped&&l.kind==='fertilizer'&&!l.productId&&/시비 건너뜀/.test(l.note||''))ch.p('logs',{...l,skipped:true})}
  if((s.schemaVersion||0)<SCHEMA)s.schemaVersion=SCHEMA;
  if(JSON.stringify(s)!==JSON.stringify(state.settings))ch.p('settings',s);
  if(!ch.empty)await commit(ch);
}

/* ---------- 식물 상태 (예정일과 별개: 실제로 기록한 상태만 사용) ---------- */
function plantCondition(pid){
  const l=state.logs.filter(x=>x.plantId===pid&&x.status&&!x.skipped).sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.completedAt||'').localeCompare(a.completedAt||''))[0];
  return l?{status:l.status,date:l.date,need:l.status!=='양호',tags:l.tags||[]}:null;
}
function needCheckPlants(){return state.plants.filter(p=>plantCondition(p.id)?.need)}
function lastLogOf(pid,kind){return state.logs.filter(l=>l.plantId===pid&&l.kind===kind&&!l.skipped).sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.completedAt||'').localeCompare(a.completedAt||''))[0]}
function lastProductFor(pid){
  const by=l=>l.kind==='fertilizer'&&!l.skipped&&l.productId&&prodby(l.productId);
  const srt=(a,b)=>(b.date||'').localeCompare(a.date||'')||(b.completedAt||'').localeCompare(a.completedAt||'');
  return (state.logs.filter(l=>l.plantId===pid&&by(l)).sort(srt)[0]||state.logs.filter(by).sort(srt)[0])?.productId||'';
}
/* ---------- 일정 계산 ---------- */
function activeTasks(){return state.tasks.filter(t=>!t.paused&&isDate(t.nextDate)&&plantOk(t.plantId))}
function taskSort(a,b){return (a.nextDate||'9').localeCompare(b.nextDate||'9')||KIND_ORDER.indexOf(a.kind)-KIND_ORDER.indexOf(b.kind)}
function intervalText(t){
  if(t.generatedByProgram)return '시비 프로그램 차례';
  if(t.intervalMode==='waterings')return `물 ${t.intervalCount||3}회마다 (${t.waterCount||0}/${t.intervalCount||3})`;
  if(t.intervalDays>0)return t.intervalDays%7===0&&t.intervalDays<=56?`${t.intervalDays/7}주마다`:t.intervalDays>=360&&t.intervalDays%365===0?`${t.intervalDays/365}년마다`:`${t.intervalDays}일마다`;
  return '1회';
}
function taskTitle(t){const k=kindInfo(t.kind,pby(t.plantId));const prod=t.kind==='fertilizer'&&t.productId?` <small>· ${esc(prodName(t.productId))}</small>`:'';return `${k.label}${prod}`}

/* 기록 1건 생성 (일정·시비 순환까지 반영). 실제 저장은 호출하는 쪽에서 commit */
function buildRecord({plantId,kind,task=null,date,productId='',note='',status='',photo='',photoDate='',tags=[],skipped=false,medium=null}){
  const ch=new Ch(), plant=pby(plantId);
  const touched=new Map(), revTasks=[], created=[];
  const T=t=>{if(!touched.has(t.id)){touched.set(t.id,{...t});revTasks.push(clone(t))}return touched.get(t.id)};
  let fp=null; const FP=()=>fp??=clone(progs());
  let prog=null; const extra=[]; let nextMsg='';
  const log={id:uid(),plantId,taskId:task?.id||'',kind,productId:productId||'',productName:productId?prodName(productId):'',date,note:note||'',status:status||'',photo:photo||'',photoDate:photo?(photoDate||date):'',tags:tags||[],skipped:!!skipped,completedAt:new Date().toISOString()};
  let deletedTaskId=null;
  if(task){
    const w=T(task);
    if(w.generatedByProgram){deletedTaskId=w.id}
    else if(!w.lastCompleted||date>=w.lastCompleted){
      w.lastCompleted=date;delete w.postponedFrom;
      if(w.intervalMode==='waterings'){w.nextDate='';w.waterCount=0;w.paused=false}
      else if(w.intervalDays>0){w.nextDate=plus(date,w.intervalDays);w.paused=false;nextMsg=`다음 ${fmt(w.nextDate)}`}
      else{w.nextDate='';w.paused=true}
    }else nextMsg='더 최근 기록이 있어 다음 일정은 그대로예요';
  }
  if(kind==='water'&&!skipped){
    for(const f of state.tasks.filter(x=>x.plantId===plantId&&x.kind==='fertilizer'&&x.intervalMode==='waterings'&&!x.generatedByProgram&&!x.paused)){
      const w=T(f);w.waterCount=(w.waterCount||0)+1;
      if(w.waterCount>=Math.max(1,w.intervalCount||3)){w.nextDate=date;w.waterCount=0;extra.push('🧪 영양제 차례예요')}
    }
    const key=progKeyFor(plant);
    if(key){const pr=FP()[key];const nid=progNextId(pr);
      if(nid){pr.waterCounts=pr.waterCounts||{};const prev=pr.waterCounts[plantId]||0;prog={key,prevWater:prev,prevNext:pr.nextIndex||0};let c=prev+1;
        if(c>=Math.max(1,pr.every||3)){c=0;
          if(!state.tasks.some(x=>x.plantId===plantId&&x.generatedByProgram&&!x.paused)){
            const nt={id:uid(),plantId,kind:'fertilizer',productId:nid,nextDate:date,intervalDays:0,intervalMode:'program',generatedByProgram:true,note:`${plant.category} 시비 프로그램`,paused:false,createdAt:new Date().toISOString()};
            ch.p('tasks',nt);created.push(nt.id);extra.push(`🧪 다음은 ${prodName(nid)} 차례예요`);
          }
        }
        pr.waterCounts[plantId]=c;
      }}
  }
  if(kind==='fertilizer'&&!skipped&&productId){
    const key=progKeyFor(plant);
    if(key){const pr=FP()[key];const idx=(pr.productIds||[]).indexOf(productId);
      if(idx>=0){prog=prog||{key,prevWater:(pr.waterCounts||{})[plantId]||0,prevNext:pr.nextIndex||0};pr.nextIndex=(idx+1)%pr.productIds.length;prog.newNext=pr.nextIndex;
        if(!task?.generatedByProgram){pr.waterCounts=pr.waterCounts||{};pr.waterCounts[plantId]=0}}
    }
  }
  let revPlant=null;
  if(kind==='repot'&&medium!=null&&plant&&medium!==(plant.medium||'')){revPlant=clone(plant);ch.p('plants',{...plant,medium})}
  if(photo&&plant&&!plant.photo){revPlant=revPlant||clone(plant);const cur=ch.put.plants?.[0]||plant;ch.p('plants',{...cur,photo})}
  for(const [id,w] of touched){if(id!==deletedTaskId)ch.p('tasks',w)}
  if(deletedTaskId)ch.d('tasks',deletedTaskId);
  if(fp)ch.p('settings',{...settings(),fertPrograms:fp});
  log.revert={tasks:revTasks,created,program:prog,plant:revPlant};
  ch.p('logs',log);
  return {ch,log,msg:[nextMsg,...extra].filter(Boolean).join(' · ')};
}
/* 같은 식물에 이후 기록이 없을 때만 일정까지 되돌릴 수 있음 */
function canRevert(l){
  if(!l.revert)return false;
  const r=l.revert;if(!r.tasks?.length&&!r.created?.length&&!r.program&&!r.plant)return false;
  return !state.logs.some(o=>o.id!==l.id&&o.plantId===l.plantId&&o.revert&&(o.completedAt||'')>(l.completedAt||''));
}
function buildRevert(l){
  const ch=new Ch();ch.d('logs',l.id);const r=l.revert||{};
  for(const prev of r.tasks||[]){if(state.tasks.some(t=>t.id===prev.id)||prev.generatedByProgram)ch.p('tasks',prev)}
  for(const id of r.created||[])if(state.tasks.some(t=>t.id===id))ch.d('tasks',id);
  if(r.program){const all=clone(progs()),pr=all[r.program.key];if(pr){pr.waterCounts=pr.waterCounts||{};pr.waterCounts[l.plantId]=r.program.prevWater;if(r.program.newNext!==undefined&&pr.nextIndex===r.program.newNext)pr.nextIndex=r.program.prevNext;ch.p('settings',{...settings(),fertPrograms:all})}}
  if(r.plant&&pby(r.plant.id)){const cur=pby(r.plant.id);ch.p('plants',{...cur,medium:r.plant.medium,photo:cur.photo===l.photo?r.plant.photo:cur.photo})}
  return ch;
}
function findTask(plantId,kind){
  const ts=state.tasks.filter(t=>t.plantId===plantId&&t.kind===kind);
  if(kind==='fertilizer'){const g=ts.find(t=>t.generatedByProgram);if(g)return g;return ts.filter(t=>!t.paused&&t.nextDate).sort(taskSort)[0]||ts.find(t=>!t.paused)||null}
  return ts.filter(t=>!t.paused&&t.nextDate).sort(taskSort)[0]||ts[0]||null;
}

/* ---------- 기록 액션 ---------- */
function quickDone(taskId){run(async()=>{
  const t=state.tasks.find(x=>x.id===taskId);if(!t)return;
  if(t.kind==='fertilizer')return openRecord({taskId});
  const d=today();
  if(state.logs.some(l=>l.taskId===t.id&&l.date===d&&!l.skipped)&&!confirm('오늘 이미 같은 기록이 있어요. 한 번 더 기록할까요?'))return;
  const {ch,log,msg}=buildRecord({plantId:t.plantId,kind:t.kind,task:t,date:d});
  await commit(ch);render();
  lastUndo={fn:()=>revertLog(log.id,true)};
  const KI=kindInfo(t.kind,pby(t.plantId));toast(`${KI.emoji} ${label(pby(t.plantId))} ${KI.label} 완료${msg?' · '+msg:''}`,true);

function batchWater(){run(async()=>{
  const d=today();
  const ids=activeTasks().filter(t=>t.kind==='water'&&t.nextDate<=d).sort(taskSort).map(t=>t.id);
  if(!ids.length)return;
  if(!confirm(`밀린 일·오늘의 물주기 ${ids.length}건을 오늘 날짜로 모두 완료할까요?`))return;
  const logIds=[];
  for(const id of ids){const t=state.tasks.find(x=>x.id===id);if(!t)continue;const {ch,log}=buildRecord({plantId:t.plantId,kind:'water',task:t,date:d});await commit(ch);logIds.push(log.id)}
  render();
  lastUndo={fn:async()=>{for(const id of logIds.reverse()){const l=state.logs.find(x=>x.id===id);if(l)await commit(buildRevert(l))}render();toast('되돌렸어요.')}};
  toast(`💧 물주기 ${logIds.length}건 완료`,true);
})}
async function revertLog(logId,fromUndo=false){
  const l=state.logs.find(x=>x.id===logId);if(!l)return;
  await commit(buildRevert(l));render();toast(fromUndo?'되돌렸어요.':'기록과 일정을 되돌렸어요.');
}

  const sched=task&&!task.generatedByProgram&&task.intervalDays>0&&task.intervalMode!=='waterings'?`<div class="note">기록한 날짜부터 ${task.intervalDays}일 뒤로 다음 일정을 잡아요.</div>`:'';

function postponeTask(taskId,to){run(async()=>{

  if(to<=today())throw Error('미루는 날짜는 내일 이후로 골라 주세요.');
  const ch=new Ch();ch.p('tasks',{...t,nextDate:to,paused:false,postponedFrom:t.postponedFrom||t.nextDate||''});
  const KI=kindInfo(t.kind,pby(t.plantId));await finish(ch,`${KI.emoji} ${label(pby(t.plantId))} ${KI.label} → ${fmt(to)}로 미뤘어요 (기록·주기는 그대로)`);
})}
function notYet(taskId,n){run(async()=>{

  const to=plus(today(),n);r.log.revert.tasks.push(clone(t));
  r.ch.p('tasks',{...t,nextDate:to,paused:false});
  await commit(r.ch);const b=modalBack;closeSheet(false);render();if(b)b();
  lastUndo={fn:()=>revertLog(r.log.id,true)};

function skipFert(taskId){run(async()=>{

function bulkRepot(){run(async()=>{

function deleteLogOnly(logId){run(async()=>{
  const l=state.logs.find(x=>x.id===logId);if(!l)return;
  if(!confirm('이 기록을 삭제할까요?'+(l.photo?' 사진도 함께 삭제돼요.':'')))return;
  const ch=new Ch();ch.d('logs',l.id);
  const t=l.taskId&&state.tasks.find(x=>x.id===l.taskId);

    const nt={...t,lastCompleted:prev?.date||''};
    if(prev&&t.intervalMode!=='waterings'&&t.intervalDays>0&&!t.paused)nt.nextDate=plus(prev.date,t.intervalDays);

function photoPicker(id,labelText,existing=''){
  return `<div class="field"><span class="flab">${labelText}</span><div class="photo-pick"><div class="pv" id="${id}Pv">${existing?`<img src="${existing}" alt="">`:'📷'}</div><div><label class="btn line sm filebtn">${existing?'사진 바꾸기':'사진 선택'}<input type="file" id="${id}" accept="image/*"></label><small>휴대폰 사진은 자동으로 줄여서 저장해요.</small></div></div></div>`;
}
function bindPhotoPicker(id){
  const inp=$('#'+id);if(!inp)return;
  inp.onchange=()=>{const f=inp.files[0];if(!f)return;const u=URL.createObjectURL(f);const img=new Image();img.onload=()=>{$('#'+id+'Pv').innerHTML='';$('#'+id+'Pv').append(img)};img.onerror=()=>{$('#'+id+'Pv').textContent='📷';URL.revokeObjectURL(u);alert('이 사진 형식은 미리보기가 안 돼요. 저장할 때 변환을 시도해요.')};img.src=u};
}
async function compress(file){
  if(!file)throw Error('사진을 선택해 주세요.');
  return new Promise((resolve,reject)=>{
    const url=URL.createObjectURL(file),img=new Image();
    img.onload=()=>{try{
      const scale=Math.min(1,1400/Math.max(img.naturalWidth,img.naturalHeight)),c=document.createElement('canvas');
      c.width=Math.max(1,Math.round(img.naturalWidth*scale));c.height=Math.max(1,Math.round(img.naturalHeight*scale));
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      c.toBlob(blob=>{URL.revokeObjectURL(url);if(!blob)return reject(Error('사진 변환에 실패했어요. iPhone 설정 > 카메라 > 포맷에서 ‘높은 호환성’을 선택하거나 JPG 사진을 사용해 주세요.'));const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(Error('사진을 읽지 못했어요.'));r.readAsDataURL(blob)},'image/jpeg',.8);
    }catch(e){URL.revokeObjectURL(url);reject(e)}};
    img.onerror=()=>{URL.revokeObjectURL(url);reject(Error('이 사진 형식을 읽지 못했어요. iPhone 설정 > 카메라 > 포맷 > 높은 호환성을 선택하거나 JPG 사진을 골라 주세요.'))};
    img.src=url;
  });
}

/* ---------- 달력 ---------- */
function calendarData(start,end){
  const d0=today(),map=new Map();const get=k=>{if(!map.has(k))map.set(k,{plan:[],pred:[],done:[],over:[]});return map.get(k)};
  for(const t of activeTasks()){
    if(t.nextDate<d0){get(d0).over.push(t)}
    else if(t.nextDate>=start&&t.nextDate<=end)get(t.nextDate).plan.push(t);
    if(t.intervalMode!=='waterings'&&!t.generatedByProgram&&t.intervalDays>0&&t.intervalDays<=120){
      let d=plus(t.nextDate<d0?d0:t.nextDate,t.intervalDays);
      while(d<=end){if(d>=start)get(d).pred.push(t);d=plus(d,t.intervalDays)}
    }
  }
  for(const l of state.logs){if(l.date>=start&&l.date<=end&&plantOk(l.plantId)&&!l.skipped)get(l.date).done.push(l)}
  return map;
}
function countKinds(arr){const m=new Map();arr.forEach(x=>{const e=x.kind==='photo'?KINDS.photo.emoji:kindInfo(x.kind,pby(x.plantId)).emoji;let o=KIND_ORDER.indexOf(x.kind);if(o<0)o=9;if(!m.has(e))m.set(e,{n:0,o});m.get(e).n++});return [...m].sort((a,b)=>a[1].o-b[1].o).map(([e,v])=>[e,v.n])}
function renderCalendar(){
  const m=ui.month,y=m.getFullYear(),mo=m.getMonth();
  const first=new Date(y,mo,1),start=new Date(y,mo,1-first.getDay());
  const days=Array.from({length:42},(_,i)=>{const d=new Date(start);d.setDate(start.getDate()+i);return d});
  const s=ymd(days[0]),e=ymd(days[41]),d0=today();const data=calendarData(s,e);
  if(!ui.day)ui.day=d0;
  const cells=days.map(d=>{const k=ymd(d),x=data.get(k)||{plan:[],pred:[],done:[],over:[]};
    const planned=countKinds([...x.over,...x.plan]).map(([kk,n])=>`<span class="mk ${x.over.length&&k===d0?'over':''}">${kk}${n>1?`<b>${n}</b>`:''}</span>`).join('');
    const pred=k>d0?countKinds(x.pred).map(([kk,n])=>`<span class="mk pred">${kk}${n>1?`<b>${n}</b>`:''}</span>`).join(''):'';
    const done=x.done.length?`<span class="mk done">✓${x.done.length}</span>`:'';
    return `<button class="day ${d.getMonth()!==mo?'dim':''} ${k===d0?'today':''} ${k===ui.day?'sel':''}" data-a="day" data-d="${k}"><span class="dn">${d.getDate()}</span><span class="marks">${planned}${pred}${done}</span></button>`}).join('');
  $('#view').innerHTML=`<div class="calhead"><button class="navbtn" data-a="month" data-n="-1" aria-label="이전 달">‹</button><b>${y}년 ${mo+1}월</b><button class="navbtn" data-a="month" data-n="1" aria-label="다음 달">›</button></div>
    <div class="cal">${[...WD].map((w,i)=>`<div class="wd ${i===0?'sun':i===6?'sat':''}">${w}</div>`).join('')}${cells}</div>
    <div class="legend"><span>💧 물</span><span>🫙 수경 물 교체</span><span>🧪 영양제</span><span>🪴 분갈이</span><span>🔎 점검</span><span>📌 기타</span><span style="opacity:.5">흐린 아이콘 = 주기상 예상</span><span style="color:var(--green);font-weight:700">✓ 완료</span>${y!==new Date().getFullYear()||mo!==new Date().getMonth()?'<button class="linkbtn" data-a="thisMonth">이번 달로</button>':''}</div>
    <div id="dayDetail"></div>`;
  renderDay(data);
}
function renderDay(data){
  const k=ui.day,d0=today();const x=(data||calendarData(k,k)).get(k)||{plan:[],pred:[],done:[],over:[]};

  if(k>d0&&x.pred.length)h+=`<div class="flab" style="margin-top:12px">주기상 예상 <span class="hint">(앞 일정을 완료하면 확정돼요)</span></div><div class="box">${x.pred.map(t=>`<button class="lrow" data-a="plant" data-id="${t.plantId}"><span class="em" style="opacity:.6">${kindInfo(t.kind,pby(t.plantId)).emoji}</span><div class="grow"><div class="t">${esc(label(pby(t.plantId)))} · ${kindInfo(t.kind,pby(t.plantId)).label}</div><div class="s">${esc(intervalText(t))}</div></div></button>`).join('')}</div>`;
  if(x.done.length)h+=`<div class="flab" style="margin-top:12px">완료한 기록</div><div class="box">${x.done.map(l=>logLine(l,{showDate:false})).join('')}</div>`;

  $('#dayDetail').innerHTML=h;
}

    document.querySelector('.rotedit').onclick=e=>{const b=e.target.closest('[data-r]');if(!b)return;readHead();const i=+b.dataset.i,a=w.productIds,nextId=a[w.nextIndex];
      if(b.dataset.r==='next')w.nextIndex=i;
      else{if(b.dataset.r==='up'&&i>0)[a[i-1],a[i]]=[a[i],a[i-1]];if(b.dataset.r==='down'&&i<a.length-1)[a[i+1],a[i]]=[a[i],a[i+1]];if(b.dataset.r==='rm')a.splice(i,1);w.nextIndex=Math.max(0,a.indexOf(nextId))}
      draw()};
    $('#gAddBtn').onclick=()=>{const v=$('#gAdd').value;if(!v)return;readHead();w.productIds.push(v);draw()};
    $('#gSave').onclick=()=>run(async()=>{
      readHead();const k=origKey||programKey(w.category,w.method);const fp=clone(progs());const old=fp[k]||{};
      fp[k]={...old,category:w.category,method:w.method,every:w.every,productIds:w.productIds.slice(),nextIndex:w.productIds.length?w.nextIndex%w.productIds.length:0,waterCounts:old.waterCounts||{}};
      const ch=new Ch();ch.p('settings',{...settings(),fertPrograms:fp});closeSheet(false);await save(ch,'시비 프로그램을 저장했어요');
    });
    if($('#gDel'))$('#gDel').onclick=()=>run(async()=>{if(!confirm('이 시비 프로그램을 삭제할까요? 이미 올라온 영양제 할 일은 남아 있어요.'))return;const fp=clone(progs());delete fp[origKey];const ch=new Ch();ch.p('settings',{...settings(),fertPrograms:fp});closeSheet(false);await save(ch,'프로그램을 삭제했어요')});
  };
  draw();
}
function productForm(id=''){
  const p=id?prodby(id):null;
  const curType=p?.type||'수용성 영양제';const known=PGROUPS.flatMap(g=>g.types);
  const typeOpts=PGROUPS.map(g=>`<optgroup label="${esc(g.label)}">${g.types.map(t=>`<option ${t===curType?'selected':''}>${t}</option>`).join('')}</optgroup>`).join('')+(known.includes(curType)?'':`<option selected>${esc(curType)}</option>`);
  const usedIn=id?Object.entries(progs()).filter(([,pr])=>(pr.productIds||[]).includes(id)).map(([k])=>parseProgramKey(k)):[];
  openSheet(p?'제품 수정':'제품 등록',`<form id="prf">
    <div class="field"><label for="prName">제품명 *</label><input id="prName" required value="${esc(p?.name||'')}"></div>
    <div class="field"><label for="prType">종류</label><select id="prType">${typeOpts}</select><small id="prTypeHint"></small></div>
    <div class="row2"><div class="field"><label for="prDil">희석 배수</label><input id="prDil" value="${esc(p?.dilution||'')}" placeholder="예: 1000 또는 100~200"></div>
    <div class="field"><label for="prAmount">사용량</label><input id="prAmount" value="${esc(p?.amount||'')}" placeholder="예: 물 1L에 1mL"></div></div>
    <div class="field"><label for="prNote">메모</label><textarea id="prNote" placeholder="사용 빈도·주의사항 (라벨 기준)">${esc(p?.note||'')}</textarea></div>
    ${usedIn.length?`<div class="note">시비 프로그램에서 사용 중: ${usedIn.map(u=>esc(u.category+' · '+u.method)).join(', ')}</div>`:''}
    <button class="btn block" type="submit">저장</button>
    ${p?`<button type="button" class="btn danger block" style="margin-top:10px" data-a="deleteProduct" data-id="${p.id}">제품 삭제</button>`:''}</form>`);
  const hint=()=>{const g=pgroup($('#prType').value);$('#prTypeHint').textContent=`${g.icon} ${g.label}${g.hint?' — '+g.hint:''}`};hint();$('#prType').onchange=hint;
  $('#prf').onsubmit=e=>{e.preventDefault();run(async()=>{
    const name=$('#prName').value.trim();if(!name)throw Error('제품명을 입력해 주세요.');
    const ch=new Ch();ch.p('products',{...(p||{}),id:p?.id||uid(),name,type:$('#prType').value,dilution:$('#prDil').value.trim(),amount:$('#prAmount').value.trim(),note:$('#prNote').value.trim()});
    closeSheet(false);await save(ch,'제품을 저장했어요');
  })};
}
function deleteProduct(id){run(async()=>{
  const p=prodby(id);if(!p)return;
  if(!confirm(`‘${p.name}’을(를) 삭제할까요? 지난 기록에는 제품 이름이 남고, 시비 순환 목록에서는 빠져요.`))return;
  const ch=new Ch();ch.d('products',id);
  state.tasks.filter(t=>t.productId===id).forEach(t=>ch.p('tasks',{...t,productId:''}));
  state.logs.filter(l=>l.productId===id&&!l.productName).forEach(l=>ch.p('logs',{...l,productName:p.name}));
  const fp=clone(progs());let changed=false;
  for(const k in fp){const pr=fp[k],i=(pr.productIds||[]).indexOf(id);if(i<0)continue;changed=true;pr.productIds.splice(i,1);if(i<(pr.nextIndex||0))pr.nextIndex--;if(!pr.productIds.length||pr.nextIndex>=pr.productIds.length)pr.nextIndex=0}
  if(changed)ch.p('settings',{...settings(),fertPrograms:fp});
  closeSheet(false);await save(ch,'제품을 삭제했어요');
})}

/* ---------- 설정·백업 ---------- */
async function renderSettings(){
  const s=settings(),lb=s.lastBackupAt;
  const nPhotos=state.plants.filter(p=>p.photo).length+state.logs.filter(l=>l.photo).length;
  $('#view').innerHTML=`
    <div class="card"><h3>백업</h3><p>식물·사진·일정·기록·제품·시비 프로그램을 파일 하나로 저장해요. ${lb?`마지막 백업: <b>${fmt(lb.slice(0,10))}</b>`:'<b>아직 백업한 적이 없어요.</b>'}</p>
      <div class="actions"><button class="btn" data-a="backup">백업 파일 저장</button>${navigator.canShare?'<button class="btn line" data-a="shareBackup">공유로 저장</button>':''}</div>
      <p class="hint" style="margin-top:10px">iPhone에서는 ‘공유로 저장’ → ‘파일에 저장’을 쓰면 원하는 폴더에 보관할 수 있어요.</p></div>
    <div class="card"><h3>백업 복원</h3><p>백업 파일 내용으로 현재 데이터를 <b>교체</b>해요. 복원 중 문제가 생기면 현재 데이터는 그대로 유지돼요.</p>
      <label class="btn line filebtn">백업 파일 선택<input type="file" id="restoreFile" accept="application/json,.json"></label></div>
    <div class="card"><h3>저장 상태</h3>
      <div class="kv">식물 ${state.plants.length} · 일정 ${state.tasks.length} · 기록 ${state.logs.length} · 제품 ${state.products.length} · 사진 ${nPhotos}</div>
      <div class="kv" id="storageInfo">저장 공간 확인 중…</div>
      <p class="hint" style="margin-top:8px">데이터는 이 기기의 이 브라우저 안에만 저장돼요. GitHub Pages 같은 곳에 웹사이트 코드를 올려도 식물 기록은 업로드되지 않아요. Mac과 iPhone 사이 자동 동기화와 푸시 알림은 없으니, 기기를 옮길 때는 백업 파일로 옮겨 주세요. iPhone Safari는 오랫동안 열지 않은 사이트의 데이터를 지울 수 있으니, <b>공유 → 홈 화면에 추가</b>로 앱처럼 쓰고 정기적으로 백업해 주세요.</p></div>
    <div class="card"><h3>기본 일정</h3><p style="margin:0">새 식물을 등록하면 물주기(고른 간격)와 분갈이 점검(1년 뒤) 일정이 만들어져요. 물주기 간격은 ‘확인 알림’이에요 — 실제로는 흙 마름과 식물 상태를 먼저 보세요.</p></div>
    <div class="card"><h3>모든 데이터 삭제</h3><p>되돌릴 수 없어요. 먼저 백업하세요.</p><button class="btn danger" data-a="clearAll">모든 데이터 삭제</button></div>
    <p class="hint" style="text-align:center">My Plants v3 · 개인용 로컬 웹앱 · 데이터 구조 v${s.schemaVersion||SCHEMA}</p>`;
  $('#restoreFile').onchange=restore;
  try{
    const persisted=await navigator.storage?.persisted?.();
    const est=await navigator.storage?.estimate?.();
    const mb=est?.usage?(est.usage/1048576).toFixed(1)+'MB 사용':'';
    const el=$('#storageInfo');if(el)el.textContent=[mb,persisted===true?'영구 저장 허용됨':persisted===false?'영구 저장 미허용 (브라우저가 정리할 수 있음)':''].filter(Boolean).join(' · ')||'확인할 수 없음';
  }catch{const el=$('#storageInfo');if(el)el.textContent='확인할 수 없음'}
}
function backupData(){return {app:'My Plants',version:3,schemaVersion:SCHEMA,exportedAt:new Date().toISOString(),plants:state.plants,products:state.products,tasks:state.tasks,logs:state.logs,settings:settings()}}
async function markBackup(){const ch=new Ch();ch.p('settings',{...settings(),lastBackupAt:new Date().toISOString()});await commit(ch)}
function backup(){run(async()=>{
  const blob=new Blob([JSON.stringify(backupData())],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`my-plants-backup-${today()}.json`;document.body.append(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  await markBackup();render();toast(`백업 파일을 만들었어요 (${(blob.size/1048576).toFixed(1)}MB)`);
})}
function shareBackup(){run(async()=>{
  const file=new File([JSON.stringify(backupData())],`my-plants-backup-${today()}.json`,{type:'application/json'});
  if(!navigator.canShare?.({files:[file]}))return backup();
  try{await navigator.share({files:[file],title:'My Plants 백업'});await markBackup();render();toast('백업을 공유했어요')}
  catch(e){if(e?.name!=='AbortError')throw e}
})}
function restore(e){const f=e.target.files[0];e.target.value='';if(!f)return;run(async()=>{
  let d;try{d=JSON.parse(await f.text())}catch{throw Error('백업 파일을 읽지 못했어요 (JSON 형식이 아니에요).')}
  if(d?.app!=='My Plants'||!Array.isArray(d.plants))throw Error('My Plants 백업 파일이 아니에요.');
  for(const n of ['plants','products','tasks','logs']){if(d[n]!=null&&!Array.isArray(d[n]))throw Error(`백업 파일의 ${n} 항목이 올바르지 않아요.`);if((d[n]||[]).some(x=>!x||typeof x!=='object'||!x.id))throw Error(`백업 파일의 ${n} 항목에 ID가 없는 데이터가 있어요.`)}
  if(!confirm(`백업(${d.exportedAt?fmt(d.exportedAt.slice(0,10)):'날짜 미상'})으로 교체할까요?\n식물 ${d.plants.length} · 일정 ${(d.tasks||[]).length} · 기록 ${(d.logs||[]).length} · 제품 ${(d.products||[]).length}\n\n현재 데이터(식물 ${state.plants.length}, 기록 ${state.logs.length})는 사라져요.`))return;
  await new Promise((ok,no)=>{
    const t=db.transaction(STORES,'readwrite');
    for(const n of STORES)t.objectStore(n).clear();
    for(const n of ['plants','products','tasks','logs'])for(const x of d[n]||[])t.objectStore(n).put(x);
    t.objectStore('settings').put({...(d.settings||{}),id:'main',seeded:true,lastBackupAt:(d.settings||{}).lastBackupAt||d.exportedAt||''});
    t.oncomplete=ok;t.onerror=()=>no(t.error);t.onabort=()=>no(t.error||Error('복원이 취소됐어요. 현재 데이터는 그대로예요.'));
  });
  await loadAll();await migrate();render();toast('복원을 마쳤어요');
})}
function clearAll(){run(async()=>{
  if(!confirm('모든 식물·사진·일정·기록·제품·시비 프로그램을 삭제할까요? 되돌릴 수 없어요.'))return;
  if(prompt('정말 삭제하려면 ‘삭제’라고 입력하세요.')!=='삭제')return toast('삭제를 취소했어요');
  await new Promise((ok,no)=>{const t=db.transaction(STORES,'readwrite');STORES.forEach(n=>t.objectStore(n).clear());t.objectStore('settings').put({id:'main',seeded:true,schemaVersion:SCHEMA});t.oncomplete=ok;t.onerror=()=>no(t.error)});
  await loadAll();render();toast('모든 데이터를 삭제했어요');
})}

/* ---------- 렌더링·이벤트 ---------- */
const TITLES={today:'오늘',plants:'내 식물',calendar:'달력',care:'영양제',settings:'설정'};
function render(){
  const d0=today();
  if(d0!==ui.lastDate){ui.lastDate=d0;ui.day=d0}
  $('#todayDate').textContent=(()=>{const d=new Date();return `${d.getMonth()+1}월 ${d.getDate()}일 ${WD[d.getDay()]}요일`})();
  $('#pageTitle').textContent=TITLES[ui.tab];
  document.querySelectorAll('.nav [data-tab]').forEach(b=>{b.classList.toggle('on',b.dataset.tab===ui.tab);b.setAttribute('aria-current',b.dataset.tab===ui.tab?'page':'false')});
  const n=activeTasks().filter(t=>t.nextDate<=d0).length;const bd=$('#navBadge');bd.hidden=!n;bd.textContent=n>99?'99+':n;
  try{({today:renderToday,plants:renderPlants,calendar:renderCalendar,care:renderCare,settings:renderSettings})[ui.tab]()}
  catch(e){console.error(e);$('#view').innerHTML=emptyHTML('화면을 그리는 중 문제가 생겼어요',`<div class="hint" style="margin-top:6px">${esc(e?.message||e)}</div><div style="margin-top:10px"><button class="btn sm" data-a="backup">데이터 백업</button></div>`)}
}
function go(tab){ui.tab=tab;window.scrollTo(0,0);render()}
const ACTIONS={
  close:()=>closeSheet(),
  undo:()=>{const u=lastUndo;lastUndo=null;$('#toast').innerHTML='';if(u)run(u.fn)},
  addPlant:()=>plantForm(),
  editPlant:d=>plantForm(d.id),
  deletePlant:d=>deletePlant(d.id),
  plant:d=>{modalBackFor.plant=d.id;plantDetail(d.id)},
  done:d=>quickDone(d.id),
  more:d=>taskMenu(d.id,$('#modal').innerHTML?backToPlant():null),
  recordTask:d=>{openRecord({taskId:d.id,back:$('#modal').innerHTML&&modalBack?modalBack:null})},
  quickRecord:d=>{const t=findTask(d.id,d.kind);openRecord({taskId:t?.id||'',plantId:d.id,kind:d.kind,back:()=>plantDetail(d.id)})},
  postpone:d=>postponeTask(d.id,d.to),
  postponeCustom:d=>postponeTask(d.id,$('#ppDate').value),
  skipFert:d=>skipFert(d.id),
  editTask:d=>taskForm('',d.id),
  addTask:d=>taskForm(d.id),
  deleteTask:d=>deleteTask(d.id),
  batchWater:()=>batchWater(),
  multi:d=>multiRecord(d.k||'water'),
  notYet:d=>notYet(d.id,Number(d.n)||2),
  optOut:d=>run(async()=>{const p=pby(d.id);if(!p)return;const ch=new Ch();ch.p('plants',{...p,fertProgramOptOut:d.v==='1'});await save(ch,d.v==='1'?'이 식물은 공통 시비 프로그램에서 뺐어요':'공통 시비 프로그램을 다시 적용해요');plantDetail(d.id)}),
  bulkRepot:()=>bulkRepot(),
  log:d=>logSheet(d.id),
  revertLog:d=>run(async()=>{const l=state.logs.find(x=>x.id===d.id);if(!l||!canRevert(l))return;const b=modalBack;closeSheet(false);await revertLog(d.id);if(b)b()}),
  deleteLog:d=>deleteLogOnly(d.id),
  setCover:d=>run(async()=>{const l=state.logs.find(x=>x.id===d.id),p=l&&pby(l.plantId);if(!p)return;const ch=new Ch();ch.p('plants',{...p,photo:l.photo});await finish(ch,'대표 사진을 바꿨어요')}),
  day:d=>{ui.day=d.d;renderCalendar();setTimeout(()=>$('#dayDetail')?.scrollIntoView({behavior:'smooth',block:'start'}),30)},
  month:d=>{ui.month=new Date(ui.month.getFullYear(),ui.month.getMonth()+Number(d.n),1);renderCalendar()},
  thisMonth:()=>{const n=new Date();ui.month=new Date(n.getFullYear(),n.getMonth(),1);ui.day=today();renderCalendar()},
  editProgram:d=>programEditor(d.key||''),
  editProduct:d=>productForm(d.id||''),
  deleteProduct:d=>deleteProduct(d.id),
  backup:()=>backup(),
  shareBackup:()=>shareBackup(),
  clearAll:()=>clearAll()
};
document.addEventListener('click',e=>{
  const tabBtn=e.target.closest('.nav [data-tab]');if(tabBtn){closeSheet(false);return go(tabBtn.dataset.tab)}
  const goBtn=e.target.closest('[data-tab-go]');if(goBtn)return go(goBtn.dataset.tabGo);
  const el=e.target.closest('[data-a]');if(!el)return;
  const fn=ACTIONS[el.dataset.a];if(!fn)return;
  e.preventDefault();fn(el.dataset);
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#modal').innerHTML)closeSheet()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&db&&today()!==ui.lastDate)render()});

(async()=>{
  try{
    const n=new Date();ui.month=new Date(n.getFullYear(),n.getMonth(),1);
    db=await openDB();await loadAll();await migrate();render();
    navigator.storage?.persist?.().catch(()=>{});
  }catch(e){console.error(e);$('#view').innerHTML=emptyHTML('저장소를 열지 못했어요',`<div style="margin-top:6px">${esc(e?.message||e)}</div><div class="hint" style="margin-top:6px">Safari 개인 정보 보호 브라우징에서는 저장이 안 될 수 있어요. 일반 창에서 열어 주세요.</div>`)}
})();
</script>
